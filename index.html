<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HomeworkPlanner — Organise tes devoirs, notes et cours facilement.">
    <title>HomeworkPlanner</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #initial-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            background-color: #0b0f19;
        }
        .initial-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: app-spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes app-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="initial-loader">
            <div class="initial-spinner"></div>
            <div style="font-weight: 700; font-size: 1.05rem; letter-spacing: 0.3px;">HomeworkPlanner</div>
            <div style="font-size: 0.82rem; color: #94a3b8; margin-top: 5px;">Chargement en cours...</div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
